api_version: platform.security/v1
kind: ScannerPlugin
metadata:
  id: lc.gau
  name: gau
  publisher: lc
  version: 2.2.4
  license: MIT
  description: "Asks web archives (Wayback Machine, Common Crawl, AlienVault OTX, urlscan) which URLs they have seen on a domain. Never touches the target."
runtime:
  type: oci
  image: nyx-plugin/gau:2.2.4
classification:
  categories: [discovery, web]
  risk_level: passive
  trust_level: verified
io:
  accepts: [domain]
  produces: [asset, log, progress]
resources:
  cpu: 1.0
  memory_mb: 256
  timeout_seconds: 900
permissions:
  network: public
  filesystem: temporary
  raw_socket: false
  host_mounts: false
  docker_socket: false
limits:
  default_rate_limit: 2
config_schema:
  type: object
  properties: {}
