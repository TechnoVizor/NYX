# docker compose --profile plugins build && docker compose up --build    web -> http://localhost:3001
# Only the web UI is published. Plugin containers can reach whatever the host publishes (Docker Desktop forwards
# host.docker.internal), so Postgres and the API stay unpublished. For host-side development and tests:
#   docker compose -f docker-compose.yml -f compose.dev.yml up -d postgres runner
x-api-env: &api-env
  NYX_DATABASE_URL: postgresql+psycopg://nyx:${POSTGRES_PASSWORD:-nyx}@postgres:5432/nyx
  NYX_ALLOW_SIGNUP: ${NYX_ALLOW_SIGNUP:-false}
  NYX_COOKIE_SECURE: ${NYX_COOKIE_SECURE:-false}
  NYX_RUNNER_URL: http://runner:8100
  NYX_RUNNER_TOKEN: ${NYX_RUNNER_TOKEN:-nyx-local-runner-token}
  NYX_TEMPORAL_ADDRESS: temporal:7233

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyx}
      POSTGRES_DB: nyx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyx -d nyx"]
      interval: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment: *api-env
    networks: [default, runner]
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_healthy  # the startup sync asks the runner for image digests
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      retries: 20

  temporal:
    # Single-node Temporal with SQLite: durable across restarts, enough for one machine. The image runs as uid 1000
    # and only its home directory is writable, so the volume goes there.
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    restart: unless-stopped
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      retries: 30

  worker:
    # Same image as the API; runs ScanWorkflow and its activities. The only process that executes scans.
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *api-env
    networks: [default, runner]
    depends_on:
      api:
        condition: service_healthy  # the API runs the migrations
      runner:
        condition: service_healthy
      temporal:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8000
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    # Local only: the first account becomes admin. See README "Putting me on a server" before exposing it.
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      api:
        condition: service_healthy

  runner:
    build: ./runner
    restart: unless-stopped
    environment:
      NYX_RUNNER_TOKEN: ${NYX_RUNNER_TOKEN:-nyx-local-runner-token}
      NYX_RUNNER_EGRESS_DENY: ${NYX_RUNNER_EGRESS_DENY:-}  # e.g. this server's public IP; see README
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # No ports, and only the API shares a network with it.
    networks: [runner]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz')"]
      interval: 3s
      retries: 20

  egress:
    # The per-run egress firewall the runner puts in front of every networked plugin.
    profiles: ["plugins"]
    image: nyx-egress:1
    build: ./runner/egress

  plugin-subfinder:
    profiles: ["plugins"]
    image: nyx-plugin/subfinder:2.16.0
    build: {context: ./plugins, dockerfile: projectdiscovery.subfinder/Dockerfile}

  plugin-dnsx:
    profiles: ["plugins"]
    image: nyx-plugin/dnsx:1.3.1
    build: {context: ./plugins, dockerfile: projectdiscovery.dnsx/Dockerfile}

  plugin-httpx:
    profiles: ["plugins"]
    image: nyx-plugin/httpx:1.12.0
    build: {context: ./plugins, dockerfile: projectdiscovery.httpx/Dockerfile}

  testbed:
    # Local lab target for safe_active plugins: add scope "nyx-lab.test" (active allowed), run httpx on testbed.nyx-lab.test.
    profiles: ["lab"]
    image: nginx:1.27-alpine
    networks:
      nyx-plugins:
        aliases: [testbed.nyx-lab.test]

volumes:
  pgdata:
  temporal-data:

networks:
  runner: {}
  # Created by the runner at startup (it also checks before every run), so it exists whether or not compose made it.
  nyx-plugins:
    name: nyx-plugins
    external: true
